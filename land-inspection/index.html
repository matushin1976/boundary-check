<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>土地閲覧調書（端末内処理）</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,"Yu Gothic",sans-serif;margin:0;color:#202020;background:#f2f4f6}
main{max-width:1200px;margin:auto;padding:16px}h1{text-align:center;letter-spacing:.2em;font-size:25px;margin:20px 0 28px}
.toolbar{background:white;border:1px solid #d5d8dd;border-radius:10px;padding:13px;margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:0;background:#1766a7;color:white;border-radius:7px;padding:10px 14px;font:inherit;cursor:pointer}
button.secondary{background:#555}.note{color:#555;font-size:12px;margin:0}.metadata{display:grid;grid-template-columns:1fr 1fr;gap:9px 40px;margin-bottom:20px}
.field{display:flex;align-items:center;border-bottom:1px solid #333;gap:10px;min-height:34px}.field b{min-width:100px;font-size:13px}
input,select,textarea{font:inherit;border:1px solid #c9d0d7;padding:6px;border-radius:4px;min-width:0;background:white;color:inherit}
.field input{border:0;flex:1;width:100%;background:transparent}
h2{font-size:16px;margin:22px 0 9px}section{margin-bottom:13px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;background:white}
th,td{border:1px solid #333;padding:0;text-align:left;font-size:13px}th{text-align:center;height:30px;background:#f4f4f4;white-space:nowrap}
td input{border:0;border-radius:0;width:100%;padding:7px 5px;min-height:36px}
td input:focus{outline:2px solid #2677ad;outline-offset:-2px}
th:nth-child(1){width:11%}th:nth-child(2){width:7%}th:nth-child(3){width:7%}th:nth-child(4){width:22%}th:nth-child(5){width:18%}th:nth-child(6){width:5%}th:nth-child(7){width:24%}th:nth-child(8){width:6%}
.section-actions{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}.section-actions button{font-size:12px;padding:7px 10px}
@page{size:A4 landscape;margin:12mm 10mm 12mm 10mm}
@media print{
body{background:white}main{max-width:none;padding:0}h1{font-size:18px;margin:7mm 0 7mm}
.toolbar,.section-actions,.note{display:none!important}
.metadata{gap:5px 15mm;margin-bottom:7mm}.field{min-height:9mm}.field input{font-size:11px}
h2{font-size:13px;margin:6mm 0 3mm}
th,td{font-size:10px;overflow-wrap:anywhere}th{height:8mm;background:white}
td input{padding:2mm 1mm;min-height:8mm;font-size:10px;white-space:normal}
input{appearance:none!important;-webkit-appearance:none!important;box-shadow:none!important}
section{break-inside:avoid}thead{display:table-header-group}tr{break-inside:avoid}
}
@media(max-width:600px){main{padding:10px}h1{font-size:21px}.metadata{grid-template-columns:1fr;gap:8px}.scroll table{min-width:920px}}
</style></head><body><main>
<div class="toolbar"><button id="print" type="button">PDF出力（印刷）</button><button id="clear" class="secondary" type="button">全項目を消去</button><p class="note">データはGitHubやサーバーに送信・保存しません。端末のブラウザ内でのみ処理し、再読み込みで消えます。PDF出力は印刷画面で「PDFに保存」を選択してください。</p></div>
<h1>土地閲覧調書</h1>
<div class="metadata">
<label class="field"><b>業務名</b><input aria-label="業務名" autocomplete="off"></label>
<label class="field"><b>所在</b><input aria-label="所在" autocomplete="off"></label>
<label class="field"><b>調査年月日</b><input aria-label="調査年月日" type="date" autocomplete="off"></label>
<label class="field"><b>調査者</b><input aria-label="調査者" autocomplete="off"></label>
</div>
<div id="sections"></div>
</main><script>
"use strict";
// No localStorage, cookies, IndexedDB, fetch, analytics or network upload.
const kinds=[["target","業務対象地"],["adjacent","隣接地"],["public","里道・水路・対面地等"]];
const fields=["地番","地目","地積","登記名義人住所","登記名義人氏名","乙区","備考","筆数"];
const counts={target:1,adjacent:2,public:1};
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function newRow(kind){
const tr=document.createElement("tr");
fields.forEach((field,i)=>{const td=document.createElement("td");const input=document.createElement("input");input.type="text";input.setAttribute("aria-label",kind+" "+field);input.autocomplete="off";if(i===2)input.inputMode="decimal";if(i===7)input.inputMode="numeric";td.appendChild(input);tr.appendChild(td);});return tr;
}
function addRow(kind){document.querySelector("#"+kind+" tbody").appendChild(newRow(kind));}
function removeRow(kind){const body=document.querySelector("#"+kind+" tbody");if(body.rows.length>1)body.deleteRow(-1);else body.querySelectorAll("input").forEach(x=>x.value="");}
function render(){
const root=document.getElementById("sections");
kinds.forEach(([kind,title])=>{
const sec=document.createElement("section");sec.id=kind;
sec.innerHTML='<h2>'+escapeHtml(title)+'</h2><div class="scroll"><table><thead><tr>'+fields.map(f=>'<th>'+f+'</th>').join("")+'</tr></thead><tbody></tbody></table></div><div class="section-actions"><button type="button" data-action="add">＋ 行を追加</button><button type="button" data-action="remove" class="secondary">－ 最終行を削除</button></div>';
root.appendChild(sec);
for(let i=0;i<counts[kind];i++)addRow(kind);
sec.querySelector('[data-action="add"]').addEventListener("click",()=>addRow(kind));
sec.querySelector('[data-action="remove"]').addEventListener("click",()=>removeRow(kind));
});
}
render();
document.getElementById("print").addEventListener("click",()=>window.print());
document.getElementById("clear").addEventListener("click",()=>{
if(!confirm("入力した内容をすべて消去しますか？"))return;
document.querySelectorAll("input").forEach(e=>e.value="");
kinds.forEach(([kind])=>{const body=document.querySelector("#"+kind+" tbody");body.replaceChildren();for(let i=0;i<counts[kind];i++)addRow(kind);});
});
</script></body></html>
