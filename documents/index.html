<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登記・測量関係資料 作成</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#1c2934;font-family:system-ui,"Yu Gothic",sans-serif}
header{background:#fff;border-bottom:1px solid #d2d8de;padding:18px max(16px,calc((100vw - 1100px)/2))}
h1{font-size:22px;margin:0 0 7px}header p{font-size:13px;color:#59646e;margin:0}
nav{display:flex;gap:10px;padding:14px max(16px,calc((100vw - 1100px)/2)) 0;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #aab8c5;border-radius:7px;background:white;font:inherit;padding:11px 18px}
button.active{background:#176ba8;color:white;border-color:#176ba8;font-weight:700}
button.output{margin-left:auto;background:#137650;color:white;border-color:#137650}
.merge{max-width:1100px;margin:14px auto;padding:16px;background:white;border:1px solid #ced6df;border-radius:10px}.merge h2{font-size:17px;margin:0 0 8px}.merge p{font-size:13px;color:#55616a}.merge input{max-width:100%}.merge button{background:#176ba8;color:white;margin-left:8px}.merge button:disabled{opacity:.5;cursor:wait}.merge .status{display:block;font-size:13px;margin-top:9px}main{max-width:1100px;margin:12px auto;padding:0 12px 24px}
.panel{background:#fff;border:1px solid #ced6df;border-radius:10px;overflow:hidden;display:none}
.panel.active{display:block}
iframe{border:0;width:100%;height:1200px;display:block}
.note{font-size:13px;color:#4b5866;padding:0 max(16px,calc((100vw - 1100px)/2))}
@media(max-width:600px){button.output{margin-left:0}nav button{flex:1 1 auto}iframe{height:1080px}}
</style></head><body>
<header><h1>登記・測量関係資料 作成</h1><p>表紙と成果品目録を一つの画面で作成・確認できます。</p></header>
<nav aria-label="書類切替">
<button class="active" data-tab="cover" aria-selected="true">① 表紙</button>
<button data-tab="list" aria-selected="false">② 成果品目録</button>
<button class="output" id="print">表示中の書類をPDF出力</button>
</nav>
<p class="note">タブを切り替えても入力内容はそのまま残ります。現在は書類ごとのPDF出力に対応しています。</p>
<section class="merge"><h2>③ チェックした仕切りページをPDF出力</h2><p>目録でチェックした項目の仕切りページを、原本と同じく中央に項目名を配置したA4縦PDFとして自動作成します。原本PDFの登録は不要です。</p><button id="extract">チェック項目のPDFを作成</button><span id="mergeStatus" class="status">目録で項目を選んでください。</span><p>※ 仕切りページの生成です。測量図・計算書などの実際の成果品は含みません。</p></section>
<main>
<section id="cover" class="panel active"><iframe id="coverFrame" title="表紙作成" src="../document-cover/"></iframe></section>
<section id="list" class="panel"><iframe id="listFrame" title="成果品目録作成" src="../deliverables/"></iframe></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
let current="cover";
document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{
 current=btn.dataset.tab;
 document.querySelectorAll("[data-tab]").forEach(b=>{const active=b===btn;b.classList.toggle("active",active);b.setAttribute("aria-selected",String(active))});
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===current));
}));
document.getElementById("print").addEventListener("click",()=>{
 const frame=document.getElementById(current==="cover"?"coverFrame":"listFrame");
 frame.contentWindow.focus();frame.contentWindow.print();
});


const extractBtn=document.getElementById("extract"),mergeStatus=document.getElementById("mergeStatus");
extractBtn.addEventListener("click",async()=>{
 extractBtn.disabled=true;
 try{
  if(!window.PDFLib)throw Error("PDF作成ライブラリを読み込めません。通信状態を確認してください");
  const listDoc=document.getElementById("listFrame").contentDocument;
  if(!listDoc||!listDoc.defaultView||!listDoc.defaultView.getDeliverableItems)throw Error("目録が読み込まれていません");
  const chosen=[...listDoc.querySelectorAll('input[type="checkbox"][data-row]:checked')].map(x=>Number(x.dataset.row));
  if(!chosen.length)throw Error("先に目録で項目をチェックしてください");
  const items=listDoc.defaultView.getDeliverableItems();
  const out=await PDFLib.PDFDocument.create();
  const W=1240,H=1754;
  const canvas=document.createElement("canvas");canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext("2d",{alpha:false});
  for(const idx of chosen){
   const [number,label]=items[idx];let title=label.split("\\n")[0].replace(/　/g," ").trim();
   if(number)title=number+". "+title;
   const isSub=!number;
   ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#111";
   ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.font=(isSub?"normal":"bold")+' 33px "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif';
   const spacing=7;
   const chars=[...title];
   const measured=chars.reduce((n,ch)=>n+ctx.measureText(ch).width,0)+Math.max(0,chars.length-1)*spacing;
   let x=(W-measured)/2;
   const y=H*0.471;
   for(const ch of chars){const w=ctx.measureText(ch).width;ctx.fillText(ch,x+w/2,y);x+=w+spacing}
   const lineWidth=measured;ctx.strokeStyle="#111";ctx.lineWidth=1.25;ctx.beginPath();ctx.moveTo((W-lineWidth)/2,y+17);ctx.lineTo((W+lineWidth)/2,y+17);ctx.stroke();
   const png=await out.embedPng(canvas.toDataURL("image/png"));
   const page=out.addPage([595.28,841.89]);page.drawImage(png,{x:0,y:0,width:595.28,height:841.89});
  }
  const bytes=await out.save();
  const blob=new Blob([bytes],{type:"application/pdf"}),url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="成果品_仕切り_"+chosen.length+"項目.pdf";a.click();
  mergeStatus.textContent=chosen.length+"項目の仕切りPDFを作成しました。";
  setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){mergeStatus.textContent="作成できません："+e.message}
 finally{extractBtn.disabled=false}
});
</script></body></html>
