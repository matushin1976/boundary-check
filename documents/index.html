<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登記・測量関係資料 作成</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#1c2934;font-family:system-ui,"Yu Gothic",sans-serif}
header{background:#fff;border-bottom:1px solid #d2d8de;padding:18px max(16px,calc((100vw - 1100px)/2))}
h1{font-size:22px;margin:0 0 7px}header p{font-size:13px;color:#59646e;margin:0}
nav{display:flex;gap:10px;padding:14px max(16px,calc((100vw - 1100px)/2)) 0;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #aab8c5;border-radius:7px;background:white;font:inherit;padding:11px 18px}
button.active{background:#176ba8;color:white;border-color:#176ba8;font-weight:700}
button.output{margin-left:auto;background:#137650;color:white;border-color:#137650}.cover-fields{padding:20px 16px 14px;background:#fff;border-bottom:0;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif}.cover-fields h2{font-size:16px;margin:0 0 12px;font-weight:600;letter-spacing:.08em}.cover-fields-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.cover-fields label{font-size:13px;display:grid;gap:5px}.cover-fields input{font:15px "Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;padding:8px 9px;border:1px solid #b5c1cb;border-radius:5px;width:100%;min-width:0}@media(max-width:760px){.cover-fields-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.merge{max-width:1100px;margin:14px auto;padding:16px;background:white;border:1px solid #ced6df;border-radius:10px}.merge h2{font-size:17px;margin:0 0 8px}.merge p{font-size:13px;color:#55616a}.merge input{max-width:100%}.merge button{background:#176ba8;color:white;margin-left:8px}.merge button:disabled{opacity:.5;cursor:wait}.merge .status{display:block;font-size:13px;margin-top:9px} .divider-empty{padding:25px;text-align:center;color:#666}.panel.divider-panel{background:#e9edf2;border:none}.list-workspace{display:grid;grid-template-columns:minmax(0,1fr) 260px;align-items:start;gap:8px;padding:8px;background:#e9edf2}.list-workspace>iframe{width:100%;height:1200px;background:#fff}.attach-area{position:sticky;top:8px;border:1px solid #dbe2e8;border-radius:8px;font-family:system-ui,"Yu Gothic",sans-serif;background:#fff;padding:14px 18px;border-bottom:1px solid #dbe2e8}.attach-area h2{font-size:16px;margin:0 0 8px}.attach-grid{display:grid;grid-template-columns:1fr;gap:12px}.attach-box{display:flex;flex-direction:column;gap:8px;border:2px dashed #9eafbf;border-radius:8px;padding:12px;min-height:108px}.attach-box.drag{background:#e9f4ff;border-color:#176ba8}.attach-box input{max-width:100%;font-size:13px}.attach-box small{color:#54636e;overflow-wrap:anywhere}.attach-box button{padding:4px 9px;font-size:12px;align-self:flex-start}.attach-help{font-size:12px;color:#52606e;margin:8px 0 0}@media(max-width:750px){.list-workspace{grid-template-columns:minmax(0,1fr) 210px;overflow-x:auto}.list-workspace>iframe{min-width:530px}.attach-area{min-width:210px}}main{max-width:1200px;margin:12px auto;padding:0 12px 24px}
.workspace-hidden{display:none!important}.case-open{max-width:1100px;margin:8px auto 0;padding:0 16px}.case-open button{background:#176ba8;color:#fff;border-color:#176ba8}.case-manager{max-width:1100px;margin:16px auto;background:#fff;border:1px solid #ccd5de;border-radius:10px;padding:16px}
.case-manager h2{margin:0 0 12px;font-size:18px}.case-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.case-controls select{font:inherit;min-width:220px;max-width:100%;padding:9px;border-radius:6px;border:1px solid #9eacb7}
.case-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.case-fields label{font-size:13px;display:grid;gap:4px}.case-fields input{font:inherit;padding:9px;border:1px solid #b5c1cb;border-radius:5px;width:100%;min-width:0}
.case-message{font-size:13px;color:#516170}.case-manager button{padding:8px 13px}
@media(max-width:760px){.case-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{background:#fff;border:1px solid #ced6df;border-radius:10px;overflow:visible;display:none}
.panel.active{display:block}#list{background:#fff}#list iframe{border:0;overflow:hidden}.panel:not(.active){display:block;position:absolute;left:-20000px;top:0;width:1100px;visibility:visible}
iframe{border:0;width:100%;height:1450px;display:block}
.note{font-size:13px;color:#4b5866;padding:0 max(16px,calc((100vw - 1100px)/2))}
@media print{body{background:white}header,nav,.note{display:none!important}.panel{display:none!important}.panel.active{display:block!important}.divider-sheet{margin:0;box-shadow:none;height:297mm;min-height:297mm}.divider-panel{background:#fff!important} iframe{display:none!important}}@media(max-width:600px){button.output{margin-left:0}nav button{flex:1 1 auto}iframe{height:1080px}}
</style></head><body>
<header><h1>登記・測量関係資料 作成</h1><p>表紙と成果品目録を一つの画面で作成・確認できます。</p></header>
<section class="case-manager" aria-label="案件管理">
<h2>案件作成・選択</h2>
<div class="case-controls"><select id="caseSelect" aria-label="案件選択"></select><button id="caseNew">＋ 新規案件</button><button id="caseSave">案件を保存</button><button id="caseDelete">案件削除</button></div>
<div class="case-fields">
<label>年度<input id="caseYear" value="令和8年度"></label>
<label>事業名<input id="caseProject"></label>
<label>所在<input id="caseLocation"></label>
<label>土地家屋調査士<input id="caseSurveyor"></label>
</div>
<p class="case-message" id="caseStatus">案件を選択するか、新規案件を作成してください。入力内容はこのブラウザに保存されます。</p>
</section>
<div class="case-open"><button id="caseOpen">この案件を開いて目録へ →</button><button id="caseBack" style="display:none">← 案件一覧に戻る</button></div>
<nav aria-label="書類切替">
<button class="active" data-tab="list" aria-selected="true">① 表紙・成果品目録</button>
<button data-tab="dividers" aria-selected="false" id="dividerTab">② 選択した成果品（0）</button>
<button class="output" id="print">表示中の書類をPDF出力</button>
</nav>
<p class="note">タブを切り替えても入力内容はそのまま残ります。目録の各行の右側でPDFを選択できます。登録すると自動チェックされ、完成PDFでは原本の仕切りページの直後にPDFを差し込みます。</p>
<main>
<section id="cover" class="panel"><iframe id="coverFrame" title="PDF生成用表紙（画面非表示）" src="../document-cover/"></iframe></section>
<section id="list" class="panel active"><iframe id="listFrame" title="成果品目録作成" src="../deliverables/?integrated=1&version=unified-layout-5"></iframe></section>
<section id="dividers" class="panel divider-panel"><div id="dividerPages" aria-live="polite"><p class="divider-empty">目録で項目をチェックしてください。</p></div></section>
</main>
<iframe id="landFrame" src="about:blank" title="土地閲覧調書PDF生成" style="position:absolute;left:-20000px;top:0;width:850px;height:2200px;border:0" aria-hidden="true"></iframe>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
let current="list";
const CASE_KEY="survey-document-projects-v1",ACTIVE_KEY="survey-document-active-v1";
let cases=[],activeCaseId=null;
const manager=document.querySelector(".case-manager"),openArea=document.querySelector(".case-open"),nav=document.querySelector("nav"),note=document.querySelector(".note"),workspace=document.querySelector("main");
let viewingCase=false;
function setView(open){viewingCase=open;manager.classList.toggle("workspace-hidden",open);nav.classList.toggle("workspace-hidden",!open);note.classList.toggle("workspace-hidden",!open);workspace.classList.toggle("workspace-hidden",!open);document.getElementById("caseOpen").style.display=open?"none":"";document.getElementById("caseBack").style.display=open?"":"none";window.scrollTo(0,0)}
document.getElementById("caseOpen").onclick=()=>{if(!selectedCase())return;readCaseFields();setView(true)};
document.getElementById("caseBack").onclick=()=>setView(false);

try{cases=JSON.parse(localStorage.getItem(CASE_KEY)||"[]");if(!Array.isArray(cases))cases=[]}catch(e){cases=[]}
const caseFieldIds={year:"caseYear",project:"caseProject",location:"caseLocation",surveyor:"caseSurveyor"};
const selectedCase=()=>cases.find(p=>p.id===activeCaseId);
function saveCases(){localStorage.setItem(CASE_KEY,JSON.stringify(cases));if(activeCaseId)localStorage.setItem(ACTIVE_KEY,activeCaseId)}
function readCaseFields(){const p=selectedCase();if(!p)return;for(const [key,id] of Object.entries(caseFieldIds))p[key]=document.getElementById(id).value;saveCases();syncCoverFields()}
function renderCaseSelect(){
 const select=document.getElementById("caseSelect");select.replaceChildren();
 if(!cases.length){const option=new Option("案件を作成してください","");select.add(option)}
 for(const p of cases)select.add(new Option((p.project||"無題の案件")+" — "+(p.location||"所在未入力"),p.id));
 select.value=activeCaseId||"";
}
function activateCase(id){
 const p=cases.find(p=>p.id===id);if(!p)return;
 activeCaseId=p.id;saveCases();renderCaseSelect();
 for(const [key,fieldId] of Object.entries(caseFieldIds))document.getElementById(fieldId).value=p[key]||"";
 document.getElementById("caseStatus").textContent="選択中："+(p.project||"無題の案件")+"（入力内容は自動保存）";
 const frame=document.getElementById("landFrame");frame.src="../land-inspection/?project="+encodeURIComponent(p.id);
 syncCoverFields();
 if(listFrame.contentDocument)syncLandLink();
}
function newCase(){
 const p={id:String(Date.now())+"-"+Math.random().toString(36).slice(2),year:"令和8年度",project:"",location:"",surveyor:""};
 cases.unshift(p);activateCase(p.id);document.getElementById("caseProject").focus();
}
document.getElementById("caseNew").onclick=newCase;
document.getElementById("caseSave").onclick=()=>{readCaseFields();document.getElementById("caseStatus").textContent="案件を保存しました"};
document.getElementById("caseDelete").onclick=()=>{
 if(!activeCaseId||!confirm("選択中の案件を削除しますか？"))return;
 cases=cases.filter(x=>x.id!==activeCaseId);activeCaseId=null;saveCases();
 if(cases.length)activateCase(cases[0].id);else newCase();
};
document.getElementById("caseSelect").onchange=e=>activateCase(e.target.value);
Object.values(caseFieldIds).forEach(id=>document.getElementById(id).addEventListener("input",()=>{readCaseFields();renderCaseSelect()}));
function syncLandLink(){
 const link=listFrame.contentDocument?.querySelector('a[href^="../land-inspection/"]');
 if(link&&activeCaseId)link.href="../land-inspection/?project="+encodeURIComponent(activeCaseId);
}

const coverFrame=document.getElementById("coverFrame");
function syncCoverFields(){const doc=coverFrame.contentDocument;if(!doc)return;const p=selectedCase();if(!p)return;for(const [key,id] of Object.entries({year:"year",project:"project",location:"location",surveyor:"surveyor"})){const target=doc.getElementById(id);if(target){target.value=p[key]||"";target.dispatchEvent(new Event("input",{bubbles:true}))}}}
coverFrame.addEventListener("load",syncCoverFields);

const listFrame=document.getElementById("listFrame"),pages=document.getElementById("dividerPages");
const printButton=document.getElementById("print"),tab=document.getElementById("dividerTab");
let sourcePromise=null,previewUrl=null,serial=0;
const attached=new Map(),DB_NAME="survey-material-attachments-v1",DB_STORE="pdf";
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbAction(mode,key,value){
 const db=await dbOpen();
 try{return await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,mode==="get"?"readonly":"readwrite"),os=tx.objectStore(DB_STORE);
 const r=mode==="get"?os.get(key):mode==="put"?os.put(value,key):os.delete(key);
 r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.onerror=()=>reject(tx.error)})}
 finally{db.close()}
}
function updateFileInfo(idx){
 const doc=listFrame.contentDocument,item=attached.get(idx);
 if(!doc)return;
 const label=doc.querySelector('[data-file-state="'+idx+'"]'),clear=doc.querySelector('button[data-remove="'+idx+'"]');
 if(label)label.textContent=item?item.name+"（"+Math.ceil(item.bytes.byteLength/1024)+"KB）":"未登録";
 if(clear)clear.hidden=!item;
}
const childGroups={4:[5,6,7,8,9],11:[12,13,14],15:[16,17],19:[20,21,22,23],27:[28,29]};
function checkRow(idx){
 const el=listFrame.contentDocument?.querySelector('input[type="checkbox"][data-row="'+idx+'"]');
 if(el&&!el.checked){el.checked=true;el.dispatchEvent(new Event("change",{bubbles:true}))}
}
function syncParentChecks(){
 for(const [parent,children] of Object.entries(childGroups)){
  if(children.some(idx=>attached.has(idx)))checkRow(Number(parent));
 }
}
function autoCheck(idx){
 if(!attached.has(idx))return;
 checkRow(idx);
 const parent=Object.keys(childGroups).find(key=>childGroups[key].includes(idx));
 if(parent!==undefined)checkRow(Number(parent));
}
async function registerPdf(idx,file){
 if(!file)return;
 if(!(file.name.toLowerCase().endsWith(".pdf")||file.type==="application/pdf"))throw Error("PDFを指定してください");
 const bytes=await file.arrayBuffer(),pdf=await PDFLib.PDFDocument.load(bytes);
 if(!pdf.getPageCount())throw Error("ページのないPDFです");
 const data={name:file.name,bytes};
 await dbAction("put",String(idx),data);
 attached.set(idx,data);updateFileInfo(idx);autoCheck(idx);
 if(current==="dividers")syncDividers();
}
const attachedReady=Promise.all(Array.from({length:30},(_,idx)=>idx).map(async idx=>{
 try{const v=await dbAction("get",String(idx));if(v)attached.set(idx,v)}
 catch(e){console.warn("保存PDFの読込失敗",idx,e)}
}));
function wireFileInputs(){
 const doc=listFrame.contentDocument;
 if(!doc)return;
 doc.querySelectorAll('input[type="file"][data-attach]').forEach(input=>{
  const idx=Number(input.dataset.attach),cell=input.closest(".upload-cell");
  input.addEventListener("change",async()=>{try{await registerPdf(idx,input.files[0])}catch(e){alert("登録できません："+e.message)}input.value=""});
  for(const type of ["dragenter","dragover"]){cell.addEventListener(type,e=>{e.preventDefault();cell.style.background="#e4f1ff"})}
  for(const type of ["dragleave","drop"]){cell.addEventListener(type,e=>{e.preventDefault();cell.style.background=""})}
  cell.addEventListener("drop",async e=>{try{await registerPdf(idx,e.dataTransfer.files[0])}catch(err){alert("登録できません："+err.message)}});
  const clear=cell.querySelector('button[data-remove]');
  clear?.addEventListener("click",async()=>{await dbAction("delete",String(idx));attached.delete(idx);updateFileInfo(idx);syncParentChecks();if(current==="dividers")syncDividers()});
 });
 attachedReady.then(()=>{for(let i=0;i<30;i++){updateFileInfo(i);autoCheck(i)}syncParentChecks();syncDividers()});
}
function selectedRows(){
 const doc=listFrame.contentDocument;
 if(!doc)return [];
 return [...doc.querySelectorAll('input[type="checkbox"][data-row]:checked')].map(e=>Number(e.dataset.row));
}
async function sourcePdf(){
 if(!sourcePromise)sourcePromise=(async()=>{
  if(!window.PDFLib)throw Error("PDF処理ライブラリの読込に失敗");
  const response=await fetch("./assets/original-sample-32pages.pdf?v=original-e565402e");
  if(!response.ok)throw Error("原本PDFが見つかりません（HTTP "+response.status+"）");
  const original=await PDFLib.PDFDocument.load(await response.arrayBuffer());
  if(original.getPageCount()!==32)throw Error("原本のページ数が正しくありません");
  return original;
 })().catch(e=>{sourcePromise=null;throw e});
 return sourcePromise;
}
async function insertGeneratedPage(out,frameId,elementSelector,isList){
 if(!window.html2canvas)throw Error("帳票描画ライブラリの読込に失敗");
 const doc=document.getElementById(frameId).contentDocument;
 if(!doc)throw Error("帳票が読み込まれていません");
 const element=doc.querySelector(elementSelector);
 if(!element)throw Error("帳票の用紙が見つかりません");
 const canvas=await html2canvas(element,{
  scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,
  onclone:clonedDoc=>{
   const style=clonedDoc.createElement("style");
   style.textContent=".paper,.sheet{box-shadow:none!important;margin:0!important;transform:none!important;zoom:1!important;width:210mm!important;height:297mm!important;min-height:297mm!important}"+
     (isList?"td.upload-cell{display:none!important}.check input[type=checkbox]{display:none!important}.check input[type=checkbox]:checked + .mark{display:inline!important}.copy-count{border:0!important;background:transparent!important;outline:0!important;width:1.8em!important}":"");
   clonedDoc.head.append(style);
  }
 });
 if(canvas.width===0||canvas.height===0)throw Error((isList?"目録":"表紙")+"の画像サイズが0です");
 const image=await out.embedPng(canvas.toDataURL("image/png"));
 const page=out.addPage([595.28,841.89]);
 page.drawImage(image,{x:0,y:0,width:595.28,height:841.89});
}
async function insertLandInspection(out){
 const frame=document.getElementById("landFrame");
 if(!activeCaseId)throw Error("案件を選択してください");
 if(!frame.contentDocument||typeof frame.contentWindow.prepareIntegration!=="function")throw Error("土地閲覧調書の作成画面を読み込めません");
 if(!frame.contentWindow.prepareIntegration(activeCaseId))throw Error("選択中の案件の土地閲覧調書がありません");
 const doc=frame.contentDocument,el=doc.getElementById("printSheet");
 const style=doc.createElement("style");style.id="integratedLandStyle";
 style.textContent='.print-sheet{display:block!important;background:#fff;color:#000;width:740px;padding:22px;font-family:"Yu Gothic","Meiryo",sans-serif;font-size:12px}.print-sheet h1{text-align:center;font-size:23px;letter-spacing:.2em}.print-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.print-info div{border-bottom:1px solid #000;padding:6px}.print-info b{display:inline-block;min-width:110px}.print-sheet h2{font-size:16px;margin:17px 0 5px}.print-sheet table{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse}.print-sheet th,.print-sheet td{border:1px solid #000;font-size:10px;padding:5px 3px;overflow-wrap:anywhere}.print-sheet th{background:#eee}';
 doc.head.append(style);
 try{
  const canvas=await html2canvas(el,{scale:2,backgroundColor:"#fff",logging:false});
  const width=canvas.width,pageHeight=Math.floor(width*297/210);
  for(let y=0;y<canvas.height;y+=pageHeight){
   const part=doc.createElement("canvas");part.width=width;part.height=pageHeight;
   const ctx=part.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,width,pageHeight);
   ctx.drawImage(canvas,0,y,width,Math.min(pageHeight,canvas.height-y),0,0,width,Math.min(pageHeight,canvas.height-y));
   const image=await out.embedPng(part.toDataURL("image/png"));
   out.addPage([595.28,841.89]).drawImage(image,{x:0,y:0,width:595.28,height:841.89});
  }
 }finally{style.remove();el.style.display="";}
}
async function makeSelectedPdf(rows){
 const src=await sourcePdf(),out=await PDFLib.PDFDocument.create();
 await insertGeneratedPage(out,"coverFrame",".paper",false);
 await insertGeneratedPage(out,"listFrame",".sheet",true);
 await attachedReady;
 for(const idx of rows){
  const [divider]=await out.copyPages(src,[idx+2]);out.addPage(divider);
  if(idx===2){await insertLandInspection(out);continue;}
  const item=attached.get(idx);
  if(item){
   const pdf=await PDFLib.PDFDocument.load(item.bytes);
   const pages=await out.copyPages(pdf,pdf.getPageIndices());
   pages.forEach(page=>out.addPage(page));
  }
 }
 return new Blob([await out.save()],{type:"application/pdf"});
}
async function syncDividers(){
 await attachedReady;
 const rows=selectedRows(),ticket=++serial;
 tab.textContent="② 選択した成果品（"+rows.length+"）";
 
 pages.textContent="表紙・目録と原本の仕切りページを準備中…";
 try{
  const pdf=await makeSelectedPdf(rows);
  if(ticket!==serial)return;
  const url=URL.createObjectURL(pdf);
  if(previewUrl)URL.revokeObjectURL(previewUrl);
  previewUrl=url;
  pages.replaceChildren();
  const viewer=document.createElement("iframe");
  viewer.title="表紙・目録と選択した原本仕切りページ";
  viewer.src=url+"#toolbar=1";
  viewer.style.width="100%";
  viewer.style.height="78vh";
  viewer.style.minHeight="600px";
  pages.append(viewer);
 }catch(e){if(ticket===serial)pages.textContent="原本PDFを表示できません："+e.message}
}
function syncLandRow(){if(activeCaseId)checkRow(2)}
window.addEventListener("focus",syncLandRow);
window.addEventListener("storage",e=>{if(e.key==="land-inspection-projects-v2"||e.key==="land-inspection-active-id")syncLandRow()});
listFrame.addEventListener("load",()=>{
 const documentHeight=listFrame.contentDocument?.documentElement?.scrollHeight;
 if(documentHeight)listFrame.style.height=Math.max(1100,documentHeight+10)+"px";
 listFrame.contentDocument?.addEventListener("change",syncDividers);
 wireFileInputs();syncLandLink();syncLandRow();
});
document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{
 current=btn.dataset.tab;
 document.querySelectorAll("[data-tab]").forEach(b=>{const active=b===btn;b.classList.toggle("active",active);b.setAttribute("aria-selected",String(active))});
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===current));
 if(current==="dividers")syncDividers();
}));
printButton.addEventListener("click",async()=>{
 if(current!=="dividers"){
  const frame=document.getElementById("listFrame");
  frame.contentWindow.focus();frame.contentWindow.print();return;
 }
 const rows=selectedRows();
 
 printButton.disabled=true;
 try{
  pages.textContent="PDFを作成中…";
  const pdf=await makeSelectedPdf(rows),url=URL.createObjectURL(pdf);
  const a=document.createElement("a");a.href=url;a.download="登記測量関係資料_"+(rows.length+2)+"ページ.pdf";
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
 }catch(e){pages.textContent="PDF出力に失敗しました："+e.message;alert("PDF出力に失敗しました："+e.message)}
 finally{printButton.disabled=false}
});
const previous=localStorage.getItem(ACTIVE_KEY);if(cases.length)activateCase(cases.find(x=>x.id===previous)?.id||cases[0].id);else newCase();setView(false);
</script></body></html>
