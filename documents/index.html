<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登記・測量関係資料 作成</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#1c2934;font-family:system-ui,"Yu Gothic",sans-serif}
header{background:#fff;border-bottom:1px solid #d2d8de;padding:18px max(16px,calc((100vw - 1100px)/2))}
h1{font-size:22px;margin:0 0 7px}header p{font-size:13px;color:#59646e;margin:0}
nav{display:flex;gap:10px;padding:14px max(16px,calc((100vw - 1100px)/2)) 0;flex-wrap:wrap}
button{cursor:pointer;border:1px solid #aab8c5;border-radius:7px;background:white;font:inherit;padding:11px 18px}
button.active{background:#176ba8;color:white;border-color:#176ba8;font-weight:700}
button.output{margin-left:auto;background:#137650;color:white;border-color:#137650}
.merge{max-width:1100px;margin:14px auto;padding:16px;background:white;border:1px solid #ced6df;border-radius:10px}.merge h2{font-size:17px;margin:0 0 8px}.merge p{font-size:13px;color:#55616a}.merge input{max-width:100%}.merge button{background:#176ba8;color:white;margin-left:8px}.merge button:disabled{opacity:.5;cursor:wait}.merge .status{display:block;font-size:13px;margin-top:9px} .divider-sheet{width:210mm;min-height:297mm;background:white;position:relative;margin:18px auto;box-shadow:0 2px 10px #ccc;break-after:page}.divider-title{position:absolute;top:47%;width:100%;text-align:center;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:16pt;letter-spacing:.28em;text-decoration:underline;text-underline-offset:6px}.divider-empty{padding:25px;text-align:center;color:#666}.panel.divider-panel{background:#e9edf2;border:none}main{max-width:1100px;margin:12px auto;padding:0 12px 24px}
.panel{background:#fff;border:1px solid #ced6df;border-radius:10px;overflow:hidden;display:none}
.panel.active{display:block}
iframe{border:0;width:100%;height:1200px;display:block}
.note{font-size:13px;color:#4b5866;padding:0 max(16px,calc((100vw - 1100px)/2))}
@media print{body{background:white}header,nav,.note{display:none!important}.panel{display:none!important}.panel.active{display:block!important}.divider-sheet{margin:0;box-shadow:none;height:297mm;min-height:297mm}.divider-panel{background:#fff!important} iframe{display:none!important}}@media(max-width:600px){button.output{margin-left:0}nav button{flex:1 1 auto}iframe{height:1080px}}
</style></head><body>
<header><h1>登記・測量関係資料 作成</h1><p>表紙と成果品目録を一つの画面で作成・確認できます。</p></header>
<nav aria-label="書類切替">
<button class="active" data-tab="cover" aria-selected="true">① 表紙</button>
<button data-tab="list" aria-selected="false">② 成果品目録</button>
<button data-tab="dividers" aria-selected="false" id="dividerTab">③ 選択した成果品（0）</button>
<button class="output" id="print">表示中の書類をPDF出力</button>
</nav>
<p class="note">タブを切り替えても入力内容はそのまま残ります。目録にチェックすると、③に対応する仕切りページが自動追加されます。成果品本体の挿入は今後対応します。</p>
<main>
<section id="cover" class="panel active"><iframe id="coverFrame" title="表紙作成" src="../document-cover/"></iframe></section>
<section id="list" class="panel"><iframe id="listFrame" title="成果品目録作成" src="../deliverables/"></iframe></section>
<section id="dividers" class="panel divider-panel"><div id="dividerPages" aria-live="polite"><p class="divider-empty">目録で項目をチェックしてください。</p></div></section>
</main>
<script>
let current="cover";
const listFrame=document.getElementById("listFrame"),pages=document.getElementById("dividerPages");
function syncDividers(){
 const doc=listFrame.contentDocument;
 if(!doc||!listFrame.contentWindow?.getDeliverableItems)return;
 const items=listFrame.contentWindow.getDeliverableItems();
 const selected=[...doc.querySelectorAll('input[type="checkbox"][data-row]:checked')].map(el=>Number(el.dataset.row));
 document.getElementById("dividerTab").textContent="③ 選択した成果品（"+selected.length+"）";
 pages.replaceChildren();
 if(!selected.length){const p=document.createElement("p");p.className="divider-empty";p.textContent="目録で項目をチェックしてください。";pages.append(p);return}
 selected.forEach(i=>{const [num,label]=items[i];const page=document.createElement("article");page.className="divider-sheet";
 const title=document.createElement("div");title.className="divider-title";title.textContent=(num?num+"　":"")+label.split("\\n")[0].replace(/　/g," ").trim();
 page.append(title);pages.append(page)});
}
listFrame.addEventListener("load",()=>{
 listFrame.contentDocument?.addEventListener("change",syncDividers);
 syncDividers();
});
document.querySelectorAll("[data-tab]").forEach(btn=>btn.addEventListener("click",()=>{
 current=btn.dataset.tab;
 document.querySelectorAll("[data-tab]").forEach(b=>{const active=b===btn;b.classList.toggle("active",active);b.setAttribute("aria-selected",String(active))});
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("active",p.id===current));
 if(current==="dividers")syncDividers();
}));
document.getElementById("print").addEventListener("click",()=>{
 if(current==="dividers"){syncDividers();window.print();return}
 const frame=document.getElementById(current==="cover"?"coverFrame":"listFrame");
 frame.contentWindow.focus();frame.contentWindow.print();
});


</script></body></html>
