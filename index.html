<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>境界点間精度管理表</title>
<style>
body{font-family:system-ui,"Yu Gothic",sans-serif;color:#222;margin:18px}main{max-width:1100px;margin:auto}h1{font-size:1.5rem}label{display:inline-block;margin:7px}input,button{font:inherit;padding:7px}button{margin:5px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #777;padding:7px;text-align:right}th{background:#e9edf1}td:nth-child(2){text-align:left}.scroll{overflow-x:auto}.ng{font-weight:bold;color:#a00}#status{margin:15px 0}small{color:#555}
@page{size:A4 landscape;margin:12mm 12mm 12mm 12mm}
@media print{main{padding-top:18mm;box-sizing:border-box}.controls,small{display:none!important}body{margin:0}input{border:0;padding:0}h1{margin-top:0}th{background:#eee!important;print-color-adjust:exact}table{font-size:11px}tr{break-inside:avoid}}
</style></head><body><main>
<h1>境界点間測量 精度管理表</h1>
<div class="controls"><label>A-Survey CSV <input type="file" id="file" accept=".csv,text/csv"></label><button id="pdf">PDF出力（印刷画面）</button></div>
<div><label>業務名 <input id="project" placeholder="業務名"></label><label>測量年月日 <input id="date" type="date"></label><label>作業者 <input id="surveyor" placeholder="作業者"></label></div>
<p id="status">CSVを選択してください。</p>
<div class="scroll"><table><thead><tr><th>No.</th><th>点間</th><th>計算距離 (m)</th><th>実測距離 (m)</th><th>較差 (m)</th><th>許容値 (m)</th><th>許容範囲</th><th>判定</th></tr></thead><tbody id="rows"></tbody></table></div>
<p><small>CSV列順：点間、計算距離、実測距離、較差、許容値、許容範囲。較差と判定は再計算します。※は元CSVの較差と不一致。PDF出力は印刷画面で「PDFに保存」を選択してください。データは外部送信しません。</small></p>
</main><script>
"use strict";
const el=id=>document.getElementById(id);let rows=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(text){return text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(s=>s.trim()).map((line,i)=>{const a=line.split(',').map(s=>s.trim());if(a.length<6)throw Error((i+1)+'行目の列が不足');const nums=a.slice(1,5).map(Number);if(nums.some(n=>!Number.isFinite(n)||n<0))throw Error((i+1)+'行目の数値が不正');const [calc,measured,sourceDiff,limit]=nums;const diff=Math.abs(calc-measured);return {point:a[0],calc,measured,diff,limit,rule:a[5],warning:Math.abs(diff-sourceDiff)>0.00051}})}
function render(){el('rows').innerHTML=rows.map((r,i)=>{const ok=r.diff<=r.limit+1e-9;return '<tr><td>'+(i+1)+'</td><td>'+esc(r.point)+'</td><td>'+r.calc.toFixed(3)+'</td><td>'+r.measured.toFixed(3)+'</td><td>'+r.diff.toFixed(3)+'</td><td>'+r.limit.toFixed(3)+'</td><td>'+esc(r.rule)+'</td><td class="'+(ok?'':'ng')+'">'+(ok?'適合':'不適合')+(r.warning?' ※':'')+'</td></tr>'}).join('');const ng=rows.filter(r=>r.diff>r.limit+1e-9).length;el('status').textContent=rows.length+'辺 / 適合 '+(rows.length-ng)+'辺 / 不適合 '+ng+'辺'+(rows.some(r=>r.warning)?'（※は較差不一致）':'')}
el('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const buffer=await file.arrayBuffer();try{let decoded;try{decoded=new TextDecoder('utf-8',{fatal:true}).decode(buffer)}catch{decoded=new TextDecoder('shift_jis').decode(buffer)}rows=parse(decoded);render()}catch(err){rows=[];el('rows').innerHTML='';el('status').textContent='読み込みエラー：'+err.message}});
el('pdf').onclick=()=>{if(!rows.length){alert('CSVを読み込んでください');return}window.print()};
</script></body></html>
